<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Docente - Control Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="text-yellow-500">🎓</span> Sistema de Reportes
            </h1>
            <div class="flex items-center gap-4">
                <span id="nombreMaestro" class="text-sm text-blue-200">Cargando usuario...</span>
                <button onclick="cerrarSesion()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold transition">Salir</button>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="max-w-6xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6 min-h-[calc(100vh-100px)] content-center">

        <!-- TARJETA 1: Nuevo Reporte -->
        <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-yellow-500">
            <h2 class="text-2xl font-bold text-blue-900 mb-4">Añadir Nuevo Reporte</h2>
            <form id="formReporte" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">ID del Alumno (Matrícula)</label>
                    <input type="text" id="alumnoId" placeholder="Ej. AL-1001" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-yellow-400 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nivel de Falta</label>
                    <select id="faltaId" class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-yellow-400 focus:outline-none" required>
                        <option value="" disabled selected>Seleccione la gravedad...</option>
                        <option value="F-1">Leve (F-1)</option>
                        <option value="F-2">Medio (F-2)</option>
                        <option value="F-3">Grave (F-3)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Descripción de los hechos</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalle lo ocurrido..." class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-yellow-400 focus:outline-none" required></textarea>
                </div>
                <button type="submit" id="btnGuardar" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2 rounded transition flex justify-center items-center">
                    <span id="textGuardar">Guardar Reporte</span>
                </button>
            </form>
        </div>

        <!-- TARJETA 2: Historial de Reportes -->
        <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-900 flex flex-col">
            <h2 class="text-2xl font-bold text-blue-900 mb-4">Buscar Historial de Alumno</h2>
            <div class="flex flex-col sm:flex-row gap-2 mb-4">
                <input type="text" id="buscarMatricula" placeholder="Ej. AL-1001" class="w-full sm:flex-1 px-3 py-2 border rounded focus:ring-2 focus:ring-blue-400 focus:outline-none">
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="buscarHistorial()" class="flex-1 sm:flex-none bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-bold px-4 py-2 rounded transition">Buscar</button>
                    <button onclick="verTodos()" class="flex-1 sm:flex-none bg-blue-900 hover:bg-blue-800 text-white font-bold px-4 py-2 rounded transition">Ver Todos</button>
                </div>
            </div>
            <div id="areaResultados" class="flex-1 bg-gray-50 border rounded p-4 overflow-y-auto max-h-72">
                <p class="text-gray-400 text-center mt-10">Ingrese una matrícula para ver el historial.</p>
            </div>
        </div>

        <!-- TARJETA 3: Información de Alumnos -->
        <div id="tarjetaAlumnos" class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-yellow-500 flex flex-col md:col-span-2 mx-auto w-full md:w-[calc(50%-0.75rem)] transition-all duration-300">
            <h2 class="text-2xl font-bold text-blue-900 mb-4">Directorio de Alumnos</h2>
            <div class="flex flex-col sm:flex-row gap-2 mb-4">
                <input type="text" id="buscarInfoMatricula" placeholder="Ej. AL-1001" class="w-full sm:flex-1 px-3 py-2 border rounded focus:ring-2 focus:ring-yellow-400 focus:outline-none">
                <button onclick="buscarInfoAlumno()" class="w-full sm:w-auto bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-bold px-4 py-2 rounded transition">Consultar</button>
            </div>
            <div id="areaInfoAlumno" class="flex-1 bg-gray-50 border rounded p-4 flex flex-col justify-center items-center min-h-[150px]">
                <p class="text-gray-400 text-center">Busque un alumno para ver sus datos.</p>
            </div>
        </div>

        <!-- TARJETA 4: Lista de Docentes  -->
        <div id="tarjetaDocentes" class="hidden bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-900 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-blue-900">Plantilla de Usuarios</h2>
                <button onclick="cargarDocentes()" class="text-blue-900 hover:text-blue-700 font-bold text-sm underline">↻ Actualizar</button>
            </div>
            <div id="areaDocentes" class="flex-1 bg-gray-50 border rounded p-4 overflow-y-auto max-h-72">
                <p class="text-gray-400 text-center mt-10">Cargando plantilla...</p>
            </div>
        </div>

    </div>

    <script>
        // 1. Declarar primero la URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyTJldS0vvZxvsJ70j5mDFYUzonfsLYOHk56b4D0YU058tDFIORZol-sVI3fv1wdsgn/exec'; 

        // 2. Verificación de Seguridad
        const usuarioActivo = JSON.parse(localStorage.getItem('usuario_activo'));
        if (!usuarioActivo) {
            window.location.href = "index.html"; 
        } else {
            document.getElementById('nombreMaestro').innerText = "Prof. " + usuarioActivo.nombre;
            
            // Limpiamos el texto de cualquier espacio en blanco accidental
            let rolLimpio = usuarioActivo.rol.trim();
            
            // Lógica exclusiva de Dirección (Acepta ambos términos)
            if (rolLimpio === "Directora" || rolLimpio === "Director") {
                document.getElementById('tarjetaDocentes').classList.remove('hidden');
                
                const tarjetaAlumnos = document.getElementById('tarjetaAlumnos');
                tarjetaAlumnos.classList.remove('md:col-span-2', 'mx-auto', 'md:w-[calc(50%-0.75rem)]');
                
                cargarDocentes(); 
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuario_activo');
            window.location.href = "index.html";
        }

        // LÓGICA DE REPORTES (Tarjetas 1 y 2)
        document.getElementById('formReporte').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            const btnText = document.getElementById('textGuardar');
            const fechaActual = new Date().toLocaleString('es-MX');

            const datosReporte = {
                accion: "insertar_reporte",
                datos: {
                    matricula: document.getElementById('alumnoId').value,
                    id_docente: usuarioActivo.id,
                    fecha_hora: fechaActual,
                    id_falta: document.getElementById('faltaId').value,
                    descripcion: document.getElementById('descripcion').value
                }
            };

            btn.disabled = true;
            btnText.innerText = "Guardando...";

            fetch(scriptURL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(datosReporte) })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btnText.innerText = "Guardar Reporte";
                if(data.success) {
                    alert("Reporte guardado exitosamente. ID generado: " + data.id_generado);
                    document.getElementById('formReporte').reset();
                } else alert("Error: " + data.mensaje);
            })
            .catch(err => {
                btn.disabled = false;
                btnText.innerText = "Guardar Reporte";
                alert("Error de conexión.");
            });
        });

        document.getElementById('buscarMatricula').addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); buscarHistorial(); }
        });

        function buscarHistorial() {
            const matricula = document.getElementById('buscarMatricula').value;
            const area = document.getElementById('areaResultados');
            if(!matricula) return alert("Ingrese una matrícula");
            area.innerHTML = '<p class="text-center text-blue-500 font-bold mt-10">Buscando...</p>';

            fetch(scriptURL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: "buscar_historial", matricula: matricula }) })
            .then(res => res.json())
            .then(data => {
                if(data.success && data.historial.length > 0) {
                    let html = `<h3 class="font-bold text-blue-900 mb-3">Reportes: ${matricula}</h3><div class="space-y-4">`;
                    data.historial.forEach(rep => {
                        let f = new Date(rep.fecha).toLocaleString('es-MX', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
                        let color = rep.falta === 'F-1' ? 'yellow' : (rep.falta === 'F-2' ? 'orange' : 'red');
                        html += `
                        <div class="bg-white p-4 border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-semibold text-blue-900 text-sm flex items-center gap-1">📅 ${f}</span>
                                <span class="bg-${color}-100 text-${color}-800 px-3 py-1 rounded-full text-xs font-bold border border-${color}-200">${rep.falta}</span>
                            </div>
                            <p class="text-gray-700 text-sm my-3 italic bg-gray-50 p-3 rounded border-l-4 border-gray-300">"${rep.descripcion}"</p>
                            <div class="pt-2 mt-2 flex justify-end">
                                <p class="text-xs text-gray-400 font-medium">Reportó: <span class="text-gray-600 font-bold">${rep.docente}</span></p>
                            </div>
                        </div>`;
                    });
                    area.innerHTML = html + `</div>`;
                } else area.innerHTML = '<p class="text-red-500 text-center mt-10">Sin reportes.</p>';
            })
            .catch(err => area.innerHTML = '<p class="text-red-500 text-center mt-10">Error de red.</p>');
        }

        function verTodos() {
            const area = document.getElementById('areaResultados');
            area.innerHTML = '<p class="text-center text-blue-500 font-bold mt-10">Cargando...</p>';
            fetch(scriptURL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: "obtener_todos" }) })
            .then(res => res.json())
            .then(data => {
                if(data.success && data.historial.length > 0) {
                    let html = `<h3 class="font-bold text-blue-900 mb-3">Historial General</h3><div class="space-y-4">`;
                    data.historial.reverse().forEach(rep => {
                        let f = new Date(rep.fecha).toLocaleString('es-MX', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
                        let color = rep.falta === 'F-1' ? 'yellow' : (rep.falta === 'F-2' ? 'orange' : 'red');
                        html += `
                        <div class="bg-white p-4 border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-bold text-blue-900 text-sm flex items-center gap-1">🎓 Alumno: ${rep.matricula}</span>
                                <span class="bg-${color}-100 text-${color}-800 px-3 py-1 rounded-full text-xs font-bold border border-${color}-200">${rep.falta}</span>
                            </div>
                            <p class="text-xs text-gray-500 mb-2">📅 ${f}</p>
                            <p class="text-gray-700 text-sm my-3 italic bg-gray-50 p-3 rounded border-l-4 border-gray-300">"${rep.descripcion}"</p>
                            <div class="pt-2 mt-2 flex justify-end">
                                <p class="text-xs text-gray-400 font-medium">Reportó: <span class="text-gray-600 font-bold">${rep.docente}</span></p>
                            </div>
                        </div>`;
                    });
                    area.innerHTML = html + `</div>`;
                } else area.innerHTML = '<p class="text-gray-500 text-center mt-10">Sin reportes en el sistema.</p>';
            })
            .catch(err => area.innerHTML = '<p class="text-red-500 text-center mt-10">Error de conexión.</p>');
        }

        // LÓGICA DE ALUMNOS (Tarjeta 3)
        document.getElementById('buscarInfoMatricula').addEventListener('keydown', function(e) {
            if (e.code === 'Enter') { e.preventDefault(); buscarInfoAlumno(); }
        });

        function buscarInfoAlumno() {
            const matricula = document.getElementById('buscarInfoMatricula').value;
            const area = document.getElementById('areaInfoAlumno');
            if(!matricula) return alert("Ingrese matrícula");
            
            area.innerHTML = '<p class="text-center text-blue-600 font-bold">Buscando...</p>';

            fetch(scriptURL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: "buscar_alumno", matricula: matricula }) })
            .then(res => res.json())
            .then(data => {
                if(data.success && data.alumno) {
                    area.innerHTML = `
                        <div class="w-full text-left">
                            <h3 class="text-xl font-bold text-blue-900">${data.alumno.nombre}</h3>
                            <div class="mt-4 space-y-2">
                                <p class="text-gray-700"><span class="font-bold">Matrícula:</span> ${data.alumno.matricula}</p>
                                <p class="text-gray-700"><span class="font-bold">Grado:</span> ${data.alumno.grado}</p>
                                <p class="text-gray-700"><span class="font-bold">Grupo:</span> ${data.alumno.grupo}</p>
                            </div>
                        </div>`;
                } else area.innerHTML = '<p class="text-red-500 text-center">Alumno no encontrado.</p>';
            })
            .catch(err => area.innerHTML = '<p class="text-red-500 text-center">Error de red.</p>');
        }

        // LÓGICA DE DOCENTES (Tarjeta 4))
        function cargarDocentes() {
            const area = document.getElementById('areaDocentes');
            area.innerHTML = '<p class="text-center text-blue-500 font-bold mt-10">Sincronizando plantilla...</p>';

            fetch(scriptURL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: "obtener_docentes" }) })
            .then(res => res.json())
            .then(data => {
                if(data.success && data.docentes.length > 0) {
                    let html = `<div class="space-y-4">`;
                    data.docentes.forEach(doc => {
                        let isPendiente = doc.estatus === 'Pendiente';
                        let colorEstatus = isPendiente ? 'bg-yellow-100 text-yellow-800 border-yellow-200' : 'bg-green-100 text-green-800 border-green-200';
                        
                        let botonAprobar = isPendiente ? `<button onclick="aprobarDocente('${doc.id}')" class="bg-blue-900 hover:bg-blue-800 text-white font-bold py-1 px-4 rounded text-xs transition">Aprobar Accesos</button>` : '';

                        html += `
                        <div class="bg-white p-4 border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-bold text-blue-900 text-sm flex items-center gap-1">
                                    👤 Usuario: ${doc.username}
                                </span>
                                <span class="${colorEstatus} px-3 py-1 rounded-full text-xs font-bold border">${doc.estatus}</span>
                            </div>
                            <p class="text-gray-700 text-sm my-3 italic bg-gray-50 p-3 rounded border-l-4 border-gray-300">
                                Nombre completo: ${doc.nombre} <br> Rol asignado: ${doc.rol}
                            </p>
                            <div class="pt-2 mt-2 flex justify-between items-center">
                                <p class="text-xs text-gray-400 font-medium">ID Interno: <span class="text-gray-600 font-bold">${doc.id}</span></p>
                                ${botonAprobar}
                            </div>
                        </div>`;
                    });
                    area.innerHTML = html + `</div>`;
                } else area.innerHTML = '<p class="text-gray-500 text-center mt-10">No hay usuarios registrados.</p>';
            })
            .catch(err => area.innerHTML = '<p class="text-red-500 text-center mt-10">Error al cargar plantilla.</p>');
        }

        function aprobarDocente(idDocente) {
            if(!confirm("¿Estás seguro de que deseas aprobar el acceso para este maestro?")) return;

            fetch(scriptURL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify({ accion: "aprobar_usuario", id_usuario: idDocente }) 
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert("Usuario aprobado exitosamente. Ya puede iniciar sesión.");
                    cargarDocentes(); 
                } else {
                    alert("Error: " + data.mensaje);
                }
            })
            .catch(err => alert("Error de red al intentar aprobar usuario."));
        }
    </script>
</body>
</html>
